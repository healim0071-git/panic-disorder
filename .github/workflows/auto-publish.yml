name: Auto Publish Columns & FAQ (Healim Panic)

on:
  schedule:
    # 매일 한국시간 오전 08:15 (UTC 23:15)에 실행되어
    # data/healim_community_hub.json의 auto_schedule 예정일(주 2~3회, +2~3일 간격)이
    # 도래한 날에만 1편씩 공식 발행 후 main 브랜치에 커밋/푸시 -> Cloudflare Pages 자동 배포
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '발행 대상 (scheduled: 예정일 체크 / column: 칼럼 1편 즉시 / faq: FAQ 1편 즉시 / both: 둘 다 즉시)'
        required: true
        default: 'both'
        type: choice
        options:
          - scheduled
          - column
          - faq
          - both
      custom_title:
        description: '치료칼럼 맞춤 제목 (선택, column 선택 시 적용)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: healim-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run official hub auto-publisher
        env:
          INPUT_TARGET: ${{ github.event.inputs.target || 'scheduled' }}
          INPUT_CUSTOM_TITLE: ${{ github.event.inputs.custom_title || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_TARGET" = "scheduled" ]; then
              node scripts/publish_hub_article.js --type=scheduled
            elif [ -n "$INPUT_CUSTOM_TITLE" ] && [ "$INPUT_TARGET" = "column" ]; then
              node scripts/publish_hub_article.js --type=column --force --custom-title="$INPUT_CUSTOM_TITLE"
            else
              node scripts/publish_hub_article.js --type="$INPUT_TARGET" --force
            fi
          else
            node scripts/publish_hub_article.js --type=scheduled
          fi

      - name: Verify pool & medical advertising compliance
        run: |
          node scripts/auto_publish_column.js
          node scripts/auto_publish_faq.js

      - name: Commit and push published updates
        run: |
          git config user.name "Healim Auto-Publisher Bot"
          git config user.email "admin@healim.com"
          if git diff --quiet -- data/healim_community_hub.json static/data/healim_community_hub.json content/columns/_index.md content/faq/_index.md; then
            echo "No new articles scheduled for today. Nothing to commit."
            exit 0
          fi
          git add data/healim_community_hub.json static/data/healim_community_hub.json content/columns/_index.md content/faq/_index.md
          KST_DATE=$(TZ="Asia/Seoul" date +"%Y-%m-%d %H:%M KST")
          git commit -m "chore(auto-publish): publish scheduled column/FAQ (${KST_DATE})"
          git push origin HEAD:main
