# ══════════════════════════════════════════════════════════════════════════════
# HUGOBLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  seo:
    title: "공황장애 | 해아림한의원"
    keywords: "공황장애, 공황발작, 공황장애한의원, 공황장애치료, 과호흡증후군, 심계항진, 광장공포증, 예기불안, 자율신경실조증, 공황장애극복, 공황장애자가진단, 해아림한의원"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "해아림한의원 공황장애 클리닉"
    organization: "해아림한의원 전국 16개 네트워크"
    type: local_business # person | organization | local_business
    tagline: "16여 년 임상 노하우와 정밀 진단 시스템"
    description: "갑작스러운 가슴 두근거림, 호흡곤란, 질식감, 극심한 공포와 예기불안 등 공황장애 증상을 진료합니다. 검사상 이상 없는 신체화 증상 및 공황발작 치료 병원을 찾는다면, 한방신경정신과 전문의, 박사 등의 해아림한의원 공황장애클리닉이 있습니다. 공황장애와 불안장애 | 공황장애와 자율신경실조증 | 재발 방지 평생 안심 치료"
    social:
      twitter: ""

  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: light # light | dark | system
    pack: "default"
    colors:
      primary: "#1c6e78"
      secondary: "#0d3a42"
      neutral: "#212121"

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "system"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    radius: "md" # none | sm | md | lg | full
    spacing: "spacious" # compact | comfortable | spacious
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar # navbar | navbar-simple | minimal
    sticky: true
    align: center # left | center | right
    search: false
    theme_toggle: true

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal # minimal | columns | centered

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} {name}"

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
