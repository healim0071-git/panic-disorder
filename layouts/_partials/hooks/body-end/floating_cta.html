{{/* Mobile Sticky Bottom CTA Bar - healim-tic signature */}}
<div class="fixed bottom-0 inset-x-0 z-50 bg-[#0d3a42]/95 backdrop-blur-md border-t border-[#1c6e78]/40 p-2.5 px-4 shadow-2xl md:hidden">
  <a href="#branches" id="btn-floating-branches" onclick="if(window.scrollToBranchesElement){window.scrollToBranchesElement(event);}" class="w-full py-3.5 px-5 rounded-xl bg-[#1c6e78] hover:bg-[#15555c] active:bg-[#0d3a42] text-white font-bold text-center text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg transition-all active:scale-[0.98]">
    <svg class="w-4 h-4 text-white flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    <span>전국 지점 안내 Click</span>
    <svg class="w-4 h-4 text-white/80 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5l7 7-7 7"/>
    </svg>
  </a>
</div>

<script>
(function() {
  window.scrollToBranchesElement = function(e) {
    var b = document.getElementById('branches');
    if (!b) {
      window.location.href = '/#branches';
      return;
    }
    if (e) {
      if (typeof e.preventDefault === 'function') e.preventDefault();
      if (typeof e.stopPropagation === 'function') e.stopPropagation();
    }
    var header = document.getElementById('site-header');
    var hOffset = header ? header.getBoundingClientRect().height : (window.innerWidth >= 1024 ? 110 : 80);
    var bRect = b.getBoundingClientRect();
    // 사진 기준 0px 오차 정밀 정렬: 헤더 바로 아래 약 18px 여백을 두고 배너 카드 상단 위치
    var targetTop = window.pageYOffset + bRect.top - hOffset - 7;
    window.scrollTo({
      top: Math.max(0, targetTop),
      behavior: 'smooth'
    });
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '#branches');
    }
  };

  // Intercept all branch guide anchors (#branches) in CAPTURE phase for 100% reliable mobile interception
  document.addEventListener('click', function(e) {
    var anchor = e.target.closest ? e.target.closest('a[href="#branches"], a[href="/#branches"], a[href*="#branches"]') : null;
    if (anchor) {
      window.scrollToBranchesElement(e);
    }
  }, true);

  // Handle direct page load with #branches hash
  if (window.location.hash === '#branches') {
    setTimeout(function() {
      window.scrollToBranchesElement();
    }, 100);
    setTimeout(function() {
      window.scrollToBranchesElement();
    }, 350);
  }

  // A(하단 지점 배너/버튼의 지점 갯수) -> B(4대 신뢰 지표 '전국 네트워크' 카드의 지점 갯수) 자동 연동 시스템
  function syncBranchCountFromAtoB() {
    // A 요소 찾기 (우선순위: #banner-branch-link-bottom -> .bg-[#0d3a42] 내부 링크 -> 지점 찾기 텍스트 링크)
    var aBtn = document.getElementById('banner-branch-link-bottom');
    if (!aBtn) {
      var allBranchLinks = document.querySelectorAll('a[href*="#branches"], a[href*="branches"]');
      for (var j = allBranchLinks.length - 1; j >= 0; j--) {
        var lText = allBranchLinks[j].textContent || '';
        if (lText.indexOf('지점 찾기') !== -1 || lText.indexOf('지점') !== -1) {
          aBtn = allBranchLinks[j];
          break;
        }
      }
    }

    // B 요소 찾기 (우선순위: #trust-branch-count -> '전국 네트워크' 카드의 .trust-number)
    var bElem = document.getElementById('trust-branch-count');
    if (!bElem) {
      var allTrustCards = document.querySelectorAll('.trust-card');
      for (var i = 0; i < allTrustCards.length; i++) {
        if (allTrustCards[i].textContent.indexOf('전국 네트워크') !== -1) {
          bElem = allTrustCards[i].querySelector('.trust-number');
          break;
        }
      }
    }

    if (!aBtn || !bElem) return;

    // A의 텍스트에서 지점 갯수 추출 (예: "가까운 16개 지점 찾기 >" -> "16")
    var aText = (aBtn.textContent || aBtn.innerText || '').trim();
    var match = aText.match(/(\d+)\s*개\s*지점/);
    if (!match) {
      match = aText.match(/(\d+)/);
    }

    if (match && match[1]) {
      var branchCount = match[1];
      var targetHtml = branchCount + '<span>개 지점</span>';
      if (bElem.innerHTML.trim() !== targetHtml) {
        bElem.innerHTML = targetHtml;
      }
    }
  }

  window.syncBranchCountFromAtoB = syncBranchCountFromAtoB;

  // 1) 즉시 실행 및 DOMContentLoaded / Load 이벤트 연동
  syncBranchCountFromAtoB();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncBranchCountFromAtoB);
  }
  window.addEventListener('load', syncBranchCountFromAtoB);

  // 2) A 요소의 텍스트 변경 감지 시 B 요소 자동 동기화 (MutationObserver)
  function attachAObserver() {
    var aBtn = document.getElementById('banner-branch-link-bottom') ||
               document.querySelector('a[href*="#branches"]');
    if (aBtn && window.MutationObserver && !aBtn._branchSyncObserverAttached) {
      aBtn._branchSyncObserverAttached = true;
      var observer = new MutationObserver(function() {
        syncBranchCountFromAtoB();
      });
      observer.observe(aBtn, { childList: true, characterData: true, subtree: true });
    }
  }

  attachAObserver();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachAObserver);
  }
  window.addEventListener('load', attachAObserver);
})();
</script>
