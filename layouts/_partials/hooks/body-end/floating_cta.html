{{/* Mobile Sticky Bottom CTA Bar - healim-tic signature */}}
<div class="fixed bottom-0 inset-x-0 z-50 bg-[#0d3a42]/95 backdrop-blur-md border-t border-[#1c6e78]/40 p-2.5 px-4 shadow-2xl md:hidden">
  <a href="/#branches" id="btn-floating-branches" class="w-full py-3.5 px-5 rounded-xl bg-[#1c6e78] hover:bg-[#15555c] active:bg-[#0d3a42] text-white font-bold text-center text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg transition-all active:scale-[0.98]">
    <svg class="w-4 h-4 text-white flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    <span>전국 지점 안내 Click</span>
    <svg class="w-4 h-4 text-white/80 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5l7 7-7 7"/>
    </svg>
  </a>
</div>

<script>
(function() {
  function scrollToBranchesElement(e) {
    var b = document.getElementById('branches');
    if (!b) return;
    if (e && typeof e.preventDefault === 'function') {
      e.preventDefault();
    }
    var header = document.getElementById('site-header');
    var hOffset = header ? header.getBoundingClientRect().height : (window.innerWidth >= 1024 ? 110 : 75);
    var bRect = b.getBoundingClientRect();
    var targetTop = window.pageYOffset + bRect.top - hOffset - 2;
    window.scrollTo({
      top: Math.max(0, targetTop),
      behavior: 'smooth'
    });
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '#branches');
    }
  }

  // Floating CTA click
  var floatBtn = document.getElementById('btn-floating-branches');
  if (floatBtn) {
    floatBtn.addEventListener('click', function(e) {
      var b = document.getElementById('branches');
      if (b) {
        scrollToBranchesElement(e);
      } else {
        window.location.href = '/#branches';
      }
    });
  }

  // Intercept all "가까운 16개 지점 찾기" anchors (#branches)
  document.addEventListener('click', function(e) {
    var anchor = e.target.closest ? e.target.closest('a[href="#branches"], a[href="/#branches"], a[href*="#branches"]') : null;
    if (anchor) {
      var b = document.getElementById('branches');
      if (b) {
        scrollToBranchesElement(e);
      }
    }
  });

  // Handle direct page load with #branches hash
  if (window.location.hash === '#branches') {
    setTimeout(function() {
      scrollToBranchesElement();
    }, 100);
    setTimeout(function() {
      scrollToBranchesElement();
    }, 350);
  }
})();
</script>
